# appId is intentionally kept as the legacy com.inknest.app: electron-updater
# matches updates by appId, and macOS keychain (safeStorage) / notarization
# identity are tied to it — changing it would break the upgrade chain and lose
# access to stored secrets for existing installs.
appId: com.inknest.app
# Display/install name only. Safe to change: the userData dir (SQLite DB, models,
# materials) is derived from package.json "name" ("claude-desk"), NOT from
# productName — verified against the packaged app.asar, which carries no
# productName field. Renaming here does not move any user data.
productName: LingXi Desktop
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tests,docs}/*'
  - '!{vitest.config.ts,electron-builder.yml}'
# Native (N-API) modules must live outside the asar so their .node / .dylib
# files can be dlopen'd at runtime.
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sherpa-onnx-node/**'
  - '**/node_modules/sherpa-onnx-darwin-*/**'
  - '**/node_modules/sherpa-onnx-linux-*/**'
  - '**/node_modules/sherpa-onnx-win-*/**'
  # Claude Code engine (真·编程 agent) — spawns a subprocess, must be on disk.
  - '**/node_modules/@anthropic-ai/claude-agent-sdk/**'
  - '**/*.node'
win:
  # Kept as the legacy exe name on purpose: existing Windows installs' desktop /
  # start-menu shortcuts and the NSIS per-user install dir reference this exe;
  # renaming it would strand old shortcuts after an auto-update.
  executableName: claude-desk
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: 灵犀桌面版需要麦克风用于语音输入转写。
    - NSDocumentsFolderUsageDescription: 灵犀桌面版需要访问文稿以读写你选择的素材与文件。
    - NSDownloadsFolderUsageDescription: 灵犀桌面版需要访问下载目录以导入素材。
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# --- Anti reverse-engineering / anti-tamper: Electron Fuses --------------------
# Fuses are flipped in the Electron binary at package time (before signing), so
# they can't be toggled back without breaking the code signature.
electronFuses:
  # Block `ELECTRON_RUN_AS_NODE=1 "LingXi Desktop" …` — otherwise an attacker can use the
  # signed binary as a Node interpreter to run arbitrary code in-process and dump
  # everything, bypassing all obfuscation. Safe here: the Claude agent subprocess
  # is spawned via a real `node`/`bun` on PATH, it does NOT rely on RUN_AS_NODE.
  runAsNode: false
  # Block attaching a debugger via --inspect / NODE_OPTIONS to read memory/source.
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  # Encrypt anything stored via Electron's safeStorage-backed cookie store.
  enableCookieEncryption: true
  # Verify the app.asar header hash at load and refuse to run if app.asar was
  # modified — stops trivial "extract → patch → repack" tampering.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
publish:
  provider: generic
  url: https://example.com/auto-updates
